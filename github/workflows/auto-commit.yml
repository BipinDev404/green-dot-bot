name: Auto Commit

on:
  schedule:
    - cron: "0 17 * * *"   # every day at 10:30 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Make random commits at random times
        run: |
          git config user.name "bipindev404"
          git config user.email "bipinfordev@gmail.com"

          COUNT=$(( (RANDOM % 15) + 1 ))
          echo "Making $COUNT commits"

          TODAY=$(date -u +%F)
          START=$(date -u -d "$TODAY 00:00:00" +%s)
          NOW=$(date -u +%s)
          RANGE=$(( NOW - START ))
          if [ $RANGE -lt 60 ]; then RANGE=60; fi

          TIMES=$(for i in $(seq 1 $COUNT); do
            echo $(( START + (RANDOM * 32768 + RANDOM) % RANGE ))
          done | sort -n)

          i=0
          for TS in $TIMES; do
            i=$((i+1))
            D=$(date -u -d "@$TS" '+%Y-%m-%dT%H:%M:%S')
            echo "Update $i at $D UTC" > activity.txt
            git add activity.txt
            GIT_AUTHOR_DATE="$D+0000" GIT_COMMITTER_DATE="$D+0000" \
              git commit -m "Auto update $D"
          done

          git push
